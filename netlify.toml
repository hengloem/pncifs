# Netlify as the public front door for the PHP origin server.
#
# Netlify cannot execute PHP: it only serves the placeholder page in ./netlify
# and proxies every other request to the origin that actually runs this
# CodeIgniter app (see "Deployment" in README.md).
#
# The proxy target is PHP_ORIGIN, the origin server's public https URL. Set it
# under [build.environment] below or in Netlify > Site settings > Environment
# variables; netlify/build-redirects.sh writes ./netlify/_redirects from it.
# Leave it unset and the build fails instead of publishing a site that answers
# HTTP 502 for every request.

[build]
  publish = "netlify"
  # No app build step: this app is rendered by PHP on the origin. The only
  # build work is turning PHP_ORIGIN into the proxy rule.
  command = "sh netlify/build-redirects.sh"

[build.environment]
  # Set the origin here instead of the Netlify UI if you prefer it in git:
  # PHP_ORIGIN = "https://pncifs-origin.onrender.com"
